<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>颜色敏锐度挑战</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <main class="app" aria-live="polite">
      <header class="app__header">
        <h1>颜色敏锐度挑战</h1>
        <p class="app__subtitle">
          观察屏幕中的色块，找出那个与众不同的颜色。点击正确色块即可进入下一关，看看你能走多远！
        </p>
      </header>

      <section class="scoreboard" aria-label="游戏状态">
        <div class="scoreboard__item">
          <span class="label">关卡</span>
          <span class="value" id="levelValue">0 / 12</span>
        </div>
        <div class="scoreboard__item">
          <span class="label">得分</span>
          <span class="value" id="scoreValue">0</span>
        </div>
        <div class="scoreboard__item">
          <span class="label">最佳</span>
          <span class="value" id="bestScoreValue">0</span>
        </div>
      </section>

      <div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="100">
        <div class="progress__fill" id="progressFill"></div>
      </div>

      <p class="message" id="message">点击“开始挑战”开启测试</p>

      <div class="board-wrapper">
        <div class="board" id="board" role="grid" aria-label="色块选择区"></div>
      </div>

      <div class="controls">
        <button class="button" id="startBtn" type="button">开始挑战</button>
        <button class="button button--ghost hidden" id="restartBtn" type="button">
          重新开始
        </button>
      </div>
    </main>

    <aside class="modal hidden" id="resultsModal" role="dialog" aria-modal="true">
      <div class="modal__content">
        <h2>挑战结果</h2>
        <p class="modal__summary">
          <strong id="finalScore">0</strong> 分 · 正确率 <strong id="finalAccuracy">0%</strong>
        </p>
        <p class="modal__best">
          历史最高分：<span id="finalBestScore">0</span>
        </p>
        <div class="modal__actions">
          <button class="button" id="playAgainBtn" type="button">再来一次</button>
          <button class="button button--ghost" id="closeModalBtn" type="button">
            返回首页
          </button>
        </div>
      </div>
    </aside>

    <script type="module" src="script.js"></script>
  </body>
</html>
